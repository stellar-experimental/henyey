[workspace]
resolver = "2"
members = [
    "crates/clock",
    "crates/henyey",
    "crates/app",
    "crates/common",
    "crates/crypto",
    "crates/db",
    "crates/bucket",
    "crates/history",
    "crates/overlay",
    "crates/scp",
    "crates/simulation",
    "crates/herder",
    "crates/ledger",
    "crates/tx",
    "crates/work",
    "crates/historywork",
    "crates/rpc",
    "crates/invariant",
]
# Soroban-env crates from crates.io are NOT workspace members.
# They are referenced as workspace dependencies with version pins below.

[workspace.package]
version = "27.0.0-alpha.1"
edition = "2021"
authors = ["Stellar Contributors"]
license = "Apache-2.0"
repository = "https://github.com/stellar/henyey"
rust-version = "1.76"

[workspace.dependencies]
# Stellar official crates
# We support multiple protocol versions by including multiple soroban-env-host versions.
# Each host version is labeled with the MAXIMUM protocol it supports.
stellar-xdr = { version = "=27.0.0", default-features = false, features = ["std", "serde", "serde_json", "base64"] }
stellar-strkey = "0.0.11"

# Soroban host crates — pinned to exact git revs from the stellar-core
# submodule's recorded gitlinks for rs-soroban-env.
# Verify alignment: bash scripts/check-soroban-pins.sh
# When bumping the stellar-core submodule, update these revs to match:
#   git -C stellar-core ls-tree HEAD src/rust/soroban/p24 src/rust/soroban/p25 src/rust/soroban/p26 src/rust/soroban/p27
soroban-env-host-p24 = { package = "soroban-env-host", git = "https://github.com/stellar/rs-soroban-env", rev = "a37eeda815e626f416eff13f2eacb32a8b0c3729" }
soroban-env-host-p25 = { package = "soroban-env-host", git = "https://github.com/stellar/rs-soroban-env", rev = "6323c1fc03ecb9f53b7c1e42fd62c1bbd3aebc2c" }
soroban-env-host-p26 = { package = "soroban-env-host", git = "https://github.com/stellar/rs-soroban-env", rev = "b351f88a468d3b9e1d6de53d5b0ca585f6b7dadb" }
soroban-env-host-p27 = { package = "soroban-env-host", git = "https://github.com/stellar/rs-soroban-env", rev = "b03d2563f3a08d51095a19bdbb6d90364b8ce04a" }

# Workspace crates
henyey-common = { path = "crates/common" }
henyey-clock = { path = "crates/clock" }
henyey-app = { path = "crates/app" }
henyey-crypto = { path = "crates/crypto" }
henyey-db = { path = "crates/db" }
henyey-bucket = { path = "crates/bucket" }
henyey-history = { path = "crates/history" }
henyey-overlay = { path = "crates/overlay" }
henyey-scp = { path = "crates/scp" }
henyey-simulation = { path = "crates/simulation" }
henyey-herder = { path = "crates/herder" }
henyey-invariant = { path = "crates/invariant" }
henyey-ledger = { path = "crates/ledger" }
henyey-tx = { path = "crates/tx" }
henyey-work = { path = "crates/work" }
henyey-historywork = { path = "crates/historywork" }
henyey-rpc = { path = "crates/rpc" }

# Crypto - pure Rust implementations
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core", "zeroize"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
subtle = "2"
blake2 = "0.10"
hmac = "0.12"
crypto_secretbox = "0.1"
salsa20 = "0.10"

# Random number generation - pure Rust
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.3"
getrandom = { version = "0.2", default-features = false, features = ["std"] }

# Async runtime
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["codec", "time"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1.3"

# Encoding - pure Rust
hex = "0.4"
base64 = "0.22"
hex-literal = "0.4"

# Compression - pure Rust backend
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
zstd = "0.13"

# HTTP client - pure Rust TLS
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "blocking"] }

# HTTP server
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "catch-panic"] }

# Database
rusqlite = { version = "0.31", features = ["bundled", "blob", "hooks"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Error handling
thiserror = "1"
anyhow = "1"

# Data structures
dashmap = "6"
im = "15"
indexmap = "2"
bytes = "1"
parking_lot = "0.12"
once_cell = "1"

# Memory safety
zeroize = { version = "1", features = ["derive"] }

# URL handling
url = "2"
fs2 = "0.4"

# Networking
socket2 = "0.5"

# Probabilistic filters
xorf = { version = "0.11", default-features = false, features = ["binary-fuse", "serde"] }

# Testing
tempfile = "3"
criterion = "0.5"

# Memory profiling (optional, feature-gated)
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.release-ci]
inherits = "release"
lto = false
codegen-units = 8

[profile.dev]
# Faster builds in dev mode
opt-level = 0
debug = true

[profile.test]
opt-level = 1

