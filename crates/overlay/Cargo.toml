[package]
name = "henyey-overlay"
description = "P2P networking for henyey"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
stellar-xdr.workspace = true
henyey-common.workspace = true
henyey-crypto.workspace = true
henyey-scp.workspace = true

# Async runtime
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true

# Crypto for X25519 key exchange and HMAC
x25519-dalek.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
blake2.workspace = true

# Serialization
serde.workspace = true

# Error handling
thiserror.workspace = true
tracing.workspace = true

# Metrics (event-site histogram/counter recording)
metrics.workspace = true

# TCP socket options
socket2.workspace = true

# Utilities
bytes.workspace = true
dashmap.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
rand.workspace = true
hex.workspace = true
stellar-strkey.workspace = true

# Database
rusqlite.workspace = true

[features]
test-utils = []

[dev-dependencies]
# Pull in henyey-common's dev-only `test-support` feature so overlay tests can
# use the shared `tracing_capture::capture_events` harness (#3773). Mirrors the
# pattern already used by crates/bucket/Cargo.toml and crates/history/Cargo.toml.
henyey-common = { workspace = true, features = ["test-support"] }
metrics-exporter-prometheus.workspace = true
serde_json.workspace = true
tempfile.workspace = true
